name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build

      # 只做编译校验（不打包），首次跑就能暴露 Rust 侧的类型问题。
      # continue-on-error + 下面那步：把编译器报错写成 check-run 注解。
      # 注解可以匿名读（`GET /repos/:o/:r/check-runs/:id/annotations`），
      # 作业日志不行。
      - name: cargo check
        id: cargo
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-check.log

      - name: 失败时把报错写成注解
        if: steps.cargo.outcome == 'failure'
        shell: bash
        run: |
          python - <<'PY'
          import re

          lines = open('cargo-check.log', encoding='utf-8', errors='replace').read().splitlines()
          keep, seen = [], set()
          for i, l in enumerate(lines):
              if re.match(r'^error(\[E\d+\])?:', l) or l.startswith('error: could not'):
                  for j in range(i, min(i + 8, len(lines))):
                      if j not in seen:
                          seen.add(j)
                          keep.append(lines[j])
          body = '\n'.join(keep) if keep else '\n'.join(lines[-120:])
          size = 2500
          chunks = [body[i:i + size] for i in range(0, min(len(body), 20000), size)][:8]
          esc = lambda s: s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          for n, c in enumerate(chunks, 1):
              print(f"::error title=cargo check {n}/{len(chunks)}::{esc(c)}")
          print(f"错误行 {len(keep)} 行 / 日志 {len(lines)} 行")
          PY
          exit 1

      # 插件 ABI 的单元测试：文件头识别、版本协商，以及现场拼一个 v1 核心模块跑兼容层。
      # 示例插件的组件用例在没有 plugin.wasm 时自动跳过（wasm 产物不入库）。
      - name: cargo test
        if: steps.cargo.outcome == 'success'
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # 插件构建链单独一个作业：wit-bindgen 编到 wasm32、wrap-component 包成组件，
  # 再确认产物真的是组件（文件头 0x000d）。这条链和主应用无关，放 Linux 上最便宜。
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/csv-viewer
            tools/wrap-component

      - name: 构建示例插件（wit-bindgen → 组件）
        run: ./plugins/csv-viewer/build.sh

      - name: 产物必须是组件
        run: |
          head -c 8 plugins/csv-viewer/plugin.wasm | od -An -tx1 | tr -d ' \n' | grep -qx '0061736d0d000100'
          ls -l plugins/csv-viewer/plugin.wasm
