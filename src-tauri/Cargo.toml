[package]
name = "x-notepad"
version = "0.2.0"
description = "X-Notepad - 笔记 + 代码编辑器"
authors = ["XFM <https://www.lovou.pw>"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "x_notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Markdown：GFM（表格 / 任务列表 / 删除线 / 脚注 / 自动链接）
comrak = "0.59"
# 编码检测 + 解码
chardetng = "1.0"
encoding_rs = "0.8"
# 元数据（标签 / 收藏 / 最近打开）
rusqlite = { version = "0.41", features = ["bundled"] }
anyhow = "1"
# 工作区文件监听（外部修改检测）
notify = "8"
# 插件市场：下载 zip（阻塞式，别把 tokio 运行时拖进同步命令）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# WASM 插件沙箱。默认开启，可用 --no-default-features 关掉换取更快的编译
wasmtime = { version = "50", optional = true }

[features]
default = ["wasm-plugins"]
wasm-plugins = ["dep:wasmtime"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
