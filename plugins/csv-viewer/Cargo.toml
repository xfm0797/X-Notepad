[package]
name = "csv-viewer"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# ABI v2：由 wit-bindgen 按 ../../wit/plugin.wit 生成 guest 胶水。
# 渲染逻辑放在 table.rs，不碰宿主，本机 `cargo test` 可以直接跑。
[dependencies]
wit-bindgen = { version = "0.57", default-features = false, features = ["macros", "realloc", "std"] }
